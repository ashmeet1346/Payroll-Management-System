  /api/audit-logs/:
    get:
      operationId: audit_logs_list
      description: Audit log list endpoint with filters.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - APPROVE
          - CREATE
          - DELETE
          - IMPORT
          - LOCK
          - LOGIN
          - PAY
          - REJECT
          - REVERSE
          - UPDATE
        description: |-
          * `CREATE` - Create
          * `UPDATE` - Update
          * `DELETE` - Delete
          * `APPROVE` - Approve
          * `REJECT` - Reject
          * `LOCK` - Lock
          * `PAY` - Record Payment
          * `REVERSE` - Reverse
          * `LOGIN` - User Login
          * `IMPORT` - Import Batch
