components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - APPROVE
      - REJECT
      - LOCK
      - PAY
      - REVERSE
      - LOGIN
      - IMPORT
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `APPROVE` - Approve
        * `REJECT` - Reject
        * `LOCK` - Lock
        * `PAY` - Record Payment
        * `REVERSE` - Reverse
        * `LOGIN` - User Login
        * `IMPORT` - Import Batch
    Advance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        advance_id:
          type: string
          description: Unique advance tracking ID (e.g. ADV-001 or FA-001)
          maxLength: 50
        worker:
          type: integer
        worker_id_code:
          type: string
          description: Unique identifier code for the worker (e.g. W001, EMP-101)
          readOnly: true
        worker_name:
          type: string
          description: Full name of the worker
          readOnly: true
        department_name:
          type: string
          description: Unique name of the department (e.g. Production, Maintenance)
          readOnly: true
        advance_type:
          $ref: '#/components/schemas/AdvanceTypeEnum'
        principal_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Original sanctioned advance amount
        monthly_deduction:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Agreed deduction per payroll run
        issue_date:
          type: string
          format: date
        repayment_start_date:
          type: string
          format: date
          nullable: true
        reason:
          type: string
        status:
          $ref: '#/components/schemas/AdvanceStatusEnum'
        outstanding_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        approved_by:
          type: integer
          nullable: true
        approved_by_name:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/AdvanceTransaction'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - advance_id
      - approved_by_name
      - created_at
      - department_name
      - id
      - issue_date
      - outstanding_balance
      - principal_amount
      - transactions
      - updated_at
      - worker
      - worker_id_code
      - worker_name
    AdvanceStatusEnum:
      enum:
      - Pending
      - Approved
      - Rejected
      - Completed
      type: string
      description: |-
        * `Pending` - Pending
        * `Approved` - Approved
        * `Rejected` - Rejected
        * `Completed` - Completed
    AdvanceTransaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        advance:
          type: integer
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        balance_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        transaction_date:
          type: string
          format: date
        reference_number:
          type: string
          maxLength: 100
        notes:
          type: string
        created_by:
          type: integer
          nullable: true
        created_by_name:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - advance
      - amount
      - balance_after
      - created_at
      - created_by_name
      - id
      - transaction_date
      - transaction_type
    AdvanceTypeEnum:
      enum:
      - Salary Advance
      - Fixed Advance
      type: string
      description: |-
        * `Salary Advance` - Salary Advance
        * `Fixed Advance` - Fixed Advance
    ApprovalStatusEnum:
      enum:
      - Draft
      - Pending Review
      - Approved
      - Rejected
      - Locked
      type: string
      description: |-
        * `Draft` - Draft
        * `Pending Review` - Pending Review
        * `Approved` - Approved
        * `Rejected` - Rejected
        * `Locked` - Locked
    AttendanceImportBatch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uploaded_by_name:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
